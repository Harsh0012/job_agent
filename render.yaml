services:
  - type: web
    name: job-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: job-agent-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
